name: job-decision-engine

services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jdec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jdec_password}
      POSTGRES_DB: ${POSTGRES_DB:-jdec}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - jdec-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jdec} -d ${POSTGRES_DB:-jdec}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  jdec-postgres-data:

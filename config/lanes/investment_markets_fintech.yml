schema_version: "2.2.0"
lane_key: INVESTMENT_MARKETS_FINTECH
display_name: "Investment, Markets & FinTech"
description: "AI, data, quantitative, platform and technology work in investing, asset management, institutional markets, banking and fintech."

scope:
  required_function_concepts:
    any:
      - AI_ENGINEERING
      - ML_ENGINEERING
      - QUANTITATIVE_RESEARCH
      - DATA_ENGINEERING
      - SOFTWARE_ENGINEERING
      - PLATFORM_ENGINEERING
      - INVESTMENT_DATA_PLATFORM
      - AI_DATA_ARCHITECTURE
      - TIME_SERIES_MODELLING
      - TECHNICAL_PROGRAMME_DELIVERY
      - TECHNICAL_PROJECT_DELIVERY
      - TECHNICAL_PRODUCT_DELIVERY
      - TECHNICAL_ARCHITECTURE
      - TECHNICAL_DELIVERY
      - TECHNICAL_LEADERSHIP

  # A job at an employer in a sector no lane covers (logistics, freight, retail, hospitality,
  # gaming, travel, fashion) does not route here unless a covered sector is also present or the
  # role itself is AI/data work (same rule as CORE_AI_DATA; see core_ai_data.yml).
  excluded_sector_concepts:
    any:
      - UNCOVERED_SECTOR

  excluded_sector_override_concepts:
    any:
      - LEGAL_REGULATORY_SECTOR
      - HEALTH_LIFE_SCIENCES_SECTOR
      - FINANCIAL_SERVICES_SECTOR
      - RESEARCH_ACADEMIC_SECTOR
      - PUBLIC_SOCIAL_SECTOR
      - ENFORCEMENT_SECTOR

  sector_exempt_domain_concepts:
    any:
      - AI
      - MACHINE_LEARNING
      - DEEP_LEARNING
      - LLM
      - NLP
      - COMPUTER_VISION
      - DATA_PLATFORM
      - DATA_ENGINEERING
      - DATA_INTELLIGENCE
      - DATA_SCIENCE
      - MLOPS
      - AI_INFRASTRUCTURE

  included_domain_concepts:
    any:
      - INVESTMENT_MANAGEMENT
      - ASSET_MANAGEMENT
      - FUND_MANAGEMENT
      - WEALTH_MANAGEMENT
      - PORTFOLIO_MANAGEMENT
      - INSTITUTIONAL_INVESTING
      - PUBLIC_MARKETS
      - CAPITAL_MARKETS
      - TRADING
      - MARKET_DATA
      - DIGITAL_ASSETS
      - WEALTHTECH
      - INVESTTECH
      - TRADING_INFRASTRUCTURE
      # Banking and fintech employers route here, ahead of LEGAL_REGTECH (legalFintechTieBreak).
      - BANKING_FINTECH

  excluded_domain_concepts:
    any:
      - PAYMENTS
      - CARDS
      - MERCHANT_ACQUIRING
      - REMITTANCE
      - BNPL
      - CONSUMER_LENDING
      - CORPORATE_FINANCE
      - TREASURY
      - M_AND_A
      - PRIVATE_EQUITY
      - INVESTMENT_BANKING

prototypes:
  - prototype_key: investment_quant_ml
    text: "Quantitative ML research, time-series modelling, portfolio analytics and investment data."
    weight: 1.0
  - prototype_key: investment_platform
    text: "Investment data platforms, market data engineering, trading technology and AI architecture."
    weight: 1.0
  - prototype_key: investment_wealthtech
    text: "WealthTech, InvestTech, portfolio platforms and investment research automation."
    weight: 0.8

routing:
  minimum_domain_score: 0.60
  minimum_function_score: 0.60
  minimum_semantic_score: 0.35
  sector_exempt_minimum_signals: 3
  secondary_lane_threshold: 0.30

sourcing:
  enabled_sources:
    - GREENHOUSE
    - ASHBY
    - LEVER
    - HIMALAYAS
  query_sets:
    - "remote quantitative machine learning"
    - "remote investment data engineer"
    - "remote asset management ai"
    - "remote market data platform architect"

budget:
  maximum_ai_interpretations_per_run: 3

documents:
  include_criteria_snapshot: true
positive_concepts:
  - time-series modelling
  - institutional investing
  - capital markets
  - securities
  - robo-advisory
  - market data
# Banking and fintech (payments, cards, lending, retail banking) are in scope for routing;
# finance-function work stays excluded. scope.excluded_domain_concepts still drives the
# discovery pre-screen and is unchanged here.
negative_concepts:
  - corporate finance
  - treasury
  - m&a
  - private equity
  - deal advisory
  - fundraising
semantic_threshold: 0.35

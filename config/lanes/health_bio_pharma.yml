schema_version: "2.2.0"
lane_key: HEALTH_BIO_PHARMA
display_name: "Health, Bio & Pharma"
description: "Life sciences, health, pharmaceutical AI, bioinformatics, computational biology and scientific machine learning."

scope:
  required_function_concepts:
    any:
      - AI_ENGINEERING
      - ML_ENGINEERING
      - DATA_ENGINEERING
      - SOFTWARE_ENGINEERING
      - PLATFORM_ENGINEERING
      - SCIENTIFIC_ML
      - RESEARCH_ENGINEERING
      - BIOINFORMATICS
      - CLINICAL_INFORMATICS
      - TECHNICAL_PROGRAMME_DELIVERY
      - TECHNICAL_PROJECT_DELIVERY
      - TECHNICAL_PRODUCT_DELIVERY
      - TECHNICAL_ARCHITECTURE
      - TECHNICAL_DELIVERY
      - TECHNICAL_LEADERSHIP

  # The work must be about a healthcare system of some sort: a health, bio, pharma, medtech,
  # clinical or healthcare sector phrase in the job's own scope, or in the employer's own
  # description (routing.sector_evidence). Benefit, perk and EEO words never count.
  required_sector_concepts:
    any:
      - HEALTH_LIFE_SCIENCES_SECTOR

  included_domain_concepts:
    any:
      - PHARMACEUTICAL
      - BIOTECH
      - HEALTHCARE
      - LIFE_SCIENCES
      - BIOINFORMATICS
      - COMPUTATIONAL_BIOLOGY
      - SCIENTIFIC_ML
      - CHEMINFORMATICS
      - CLINICAL_NLP
      - GENOMICS
      - MEDICAL_IMAGING

prototypes:
  - prototype_key: pharma_biotech_ml
    text: "Pharmaceutical AI, biotech machine learning, drug discovery and computational biology."
    weight: 1.0
  - prototype_key: clinical_health_ai
    text: "Clinical AI, healthcare ML, medical imaging, clinical NLP and health data platforms."
    weight: 0.95
  - prototype_key: scientific_ml
    text: "Scientific machine learning, research engineering, bioinformatics and research software."
    weight: 0.9

routing:
  minimum_domain_score: 0.60
  minimum_function_score: 0.60
  minimum_semantic_score: 0.35
  # A pharma/medtech company's or a hospital's generic engineering role qualifies through the
  # employer's own description (company name, opening, About Us), never its benefits text.
  sector_evidence: JOB_SCOPE_OR_EMPLOYER
  secondary_lane_threshold: 0.30

sourcing:
  enabled_sources:
    - GREENHOUSE
    - ASHBY
    - LEVER
    - HIMALAYAS
  query_sets:
    - "remote pharmaceutical engineer"
    - "remote biotech machine learning"
    - "remote healthcare data scientist"
    - "remote scientific ml researcher"

budget:
  maximum_ai_interpretations_per_run: 3

documents:
  include_criteria_snapshot: true
positive_concepts:
  - pharma
  - bioinformatics
  - biotech
  - medical research domain
  - machine learning on biological or clinical data
  - scientific data platforms
negative_concepts:
  - laboratory-bound
  - patient-facing
  - clinical-operations
  - medical sales
  - laboratory-only work
semantic_threshold: 0.35

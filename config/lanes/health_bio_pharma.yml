schema_version: "2.0"
lane_key: HEALTH_BIO_PHARMA
display_name: "Health, Bio & Pharma"
description: "Life sciences, health, pharmaceutical AI, bioinformatics, computational biology and scientific machine learning."

scope:
  required_function_concepts:
    any:
      - ML_ENGINEERING
      - DATA_ENGINEERING
      - SCIENTIFIC_ML
      - RESEARCH_ENGINEERING
      - BIOINFORMATICS
      - CLINICAL_INFORMATICS

  included_domain_concepts:
    any:
      - PHARMACEUTICAL
      - BIOTECH
      - HEALTHCARE
      - LIFE_SCIENCES
      - BIOINFORMATICS
      - COMPUTATIONAL_BIOLOGY
      - SCIENTIFIC_ML
      - CHEMINFORMATICS
      - CLINICAL_NLP
      - GENOMICS
      - MEDICAL_IMAGING

prototypes:
  - prototype_key: pharma_biotech_ml
    text: "Pharmaceutical AI, biotech machine learning, drug discovery and computational biology."
    weight: 1.0
  - prototype_key: clinical_health_ai
    text: "Clinical AI, healthcare ML, medical imaging, clinical NLP and health data platforms."
    weight: 0.95
  - prototype_key: scientific_ml
    text: "Scientific machine learning, research engineering, bioinformatics and research software."
    weight: 0.9

routing:
  minimum_domain_score: 0.60
  minimum_function_score: 0.60
  minimum_semantic_score: 0.35
  secondary_lane_threshold: 0.30

sourcing:
  enabled_sources:
    - GREENHOUSE
    - ASHBY
    - LEVER
    - HIMALAYAS
  query_sets:
    - "remote pharmaceutical engineer"
    - "remote biotech machine learning"
    - "remote healthcare data scientist"
    - "remote scientific ml researcher"

budget:
  maximum_ai_interpretations_per_run: 3

documents:
  include_criteria_snapshot: true
positive_concepts:
  - pharma
  - bioinformatics
  - biotech
  - medical research domain
  - machine learning on biological or clinical data
  - scientific data platforms
negative_concepts:
  - laboratory-bound
  - patient-facing
  - clinical-operations
  - medical sales
  - laboratory-only work
ai_evaluation_limit: 3
semantic_threshold: 0.68

schema_version: "2.2.0"
lane_key: CORE_AI_DATA
display_name: "Core AI & Data Engineering"
description: "Hands-on distributed AI systems, LLM infrastructure, data pipelines, MLOps, deep learning research, and technical architecture."

scope:
  required_function_concepts:
    any:
      - AI_ENGINEERING
      - ML_ENGINEERING
      - DATA_ENGINEERING
      - SOFTWARE_ENGINEERING
      - PLATFORM_ENGINEERING
      - AI_DATA_ARCHITECTURE
      - AI_SYSTEMS_ARCHITECTURE
      - LLM_INFRASTRUCTURE
      - AI_RESEARCH
      - DATA_SCIENCE
      - TECHNICAL_PROGRAMME_DELIVERY
      - TECHNICAL_PROJECT_DELIVERY
      - TECHNICAL_PRODUCT_DELIVERY
      - TECHNICAL_ARCHITECTURE
      - TECHNICAL_DELIVERY
      - TECHNICAL_LEADERSHIP

  # Cloud, DevOps and software-platform engineering are in scope with AI and data; the
  # title must still pass hasCoreTechnicalFunction.
  included_domain_concepts:
    any:
      - AI
      - MACHINE_LEARNING
      - DEEP_LEARNING
      - LLM
      - NLP
      - COMPUTER_VISION
      - DATA_PLATFORM
      - DATA_ENGINEERING
      - DATA_INTELLIGENCE
      - MLOPS
      - AI_INFRASTRUCTURE
      - CLOUD_PLATFORM
      - DEVOPS
      - SOFTWARE_PLATFORM

  # A job in a sector no lane covers (logistics, freight, retail, hospitality, gaming, travel,
  # fashion) routes here only when the role itself is AI/data work: an AI/data phrase in the
  # title, or routing.sector_exempt_minimum_signals distinct AI/data phrases in the role text.
  # Generic software, cloud, DevOps or security work there ends UNCLASSIFIED. The sector is
  # read from the job's scope and the employer's own description (company name, opening,
  # About Us); an industry list ("serves finance, retail and healthcare") is not the
  # employer's sector.
  # A positive technology-sector requirement is not used: most software employers never call
  # themselves a "technology company", so it would push good engineering roles out.
  excluded_sector_concepts:
    any:
      - UNCOVERED_SECTOR

  # A covered sector cancels an uncovered match (a bank's retail banking unit, a hospital's
  # restaurant operations, a public agency's logistics systems).
  excluded_sector_override_concepts:
    any:
      - LEGAL_REGULATORY_SECTOR
      - HEALTH_LIFE_SCIENCES_SECTOR
      - FINANCIAL_SERVICES_SECTOR
      - RESEARCH_ACADEMIC_SECTOR
      - PUBLIC_SOCIAL_SECTOR
      - ENFORCEMENT_SECTOR

  sector_exempt_domain_concepts:
    any:
      - AI
      - MACHINE_LEARNING
      - DEEP_LEARNING
      - LLM
      - NLP
      - COMPUTER_VISION
      - DATA_PLATFORM
      - DATA_ENGINEERING
      - DATA_INTELLIGENCE
      - DATA_SCIENCE
      - MLOPS
      - AI_INFRASTRUCTURE

  excluded_domain_concepts:
    any:
      - "ios developer"
      - "ios engineer"
      - "android developer"
      - "android engineer"
      - "mobile developer"
      - "mobile engineer"
      - "react native developer"
      - "flutter developer"

prototypes:
  - prototype_key: ai_systems_building
    text: "Building production AI/ML systems, LLM applications, data platforms and MLOps infrastructure."
    weight: 1.0
  - prototype_key: ai_research
    text: "AI research, deep learning research, computer vision, NLP and ML innovation."
    weight: 0.9

routing:
  minimum_domain_score: 0.60
  minimum_function_score: 0.60
  minimum_semantic_score: 0.35
  sector_exempt_minimum_signals: 3
  secondary_lane_threshold: 0.30

sourcing:
  enabled_sources:
    - GREENHOUSE
    - ASHBY
    - LEVER
    - HIMALAYAS
  query_sets:
    - "remote machine learning engineer"
    - "remote ai engineer"
    - "remote data engineer"
    - "remote mlops engineer"

budget:
  maximum_ai_interpretations_per_run: 3

documents:
  include_criteria_snapshot: true
positive_concepts:
  - machine learning
  - deep learning
  - nlp
  - llm
  - agentic
  - data engineering
  - architecture
negative_concepts:
  - presales
  - solutions consulting
  - customer success
  - fde
  - technical account management
  - programme governance
  - people-management-heavy
  - ios developer
  - ios engineer
  - android developer
  - android engineer
  - mobile developer
  - mobile engineer
  - react native developer
  - flutter developer
semantic_threshold: 0.35

schema_version: "2.2.0"
source_key: mcf_saved
display_name: MyCareersFuture saved jobs (user browser export, manual)
kind: manual_import
status: active
capabilities:
  discovery: false
  pagination: false
  incremental: false
  location_filter: false
  work_mode_evidence: false
compliance:
  access_basis: user_supplied
  terms_url: https://www.mycareersfuture.gov.sg/terms-of-use
  license: null
  attribution_required: true
  attribution_text: >-
    USER-ACCEPTED RISK, PENDING SWDA PERMISSION. The user's own saved-job selections, exported
    manually in their own signed-in browser tab with scripts/mcf/export_saved_jobs.console.js
    (it reads the rendered Saved jobs list and requests each saved job's public details the
    way the MyCareersFuture job page does, sequentially about 2 seconds apart, stopping on a
    rate limit or error page), then imported with npm run import:mcf-saved for personal
    job-search use. The MyCareersFuture Terms of Use grant visitors a personal licence but do
    not allow storing site content in a retrieval system without written permission from SWDA,
    which operates MyCareersFuture; that permission has not been obtained (request it through
    https://service-portal.swda.gov.sg/s/feedback). This source is therefore not cleanly
    compliant: the user has chosen to accept the risk. The repository never signs in to
    MyCareersFuture, stores or reads no MyCareersFuture session or cookie, and runs no
    automated or scheduled MyCareersFuture access. Recruiter contact fields are not exported.
    The MyCareersFuture job URL is kept for attribution; imported content does not establish
    that a job is still open.
  authenticated_scraping: false
  reviewed_at: "2026-11-08"
schedule:
  enabled: false
  interval_minutes: 1440
  jitter_seconds: 0
request:
  endpoint: https://example.invalid/mcf-saved-export
  timeout_ms: 15000
  headers_from_secret_keys: []
  retry:
    max_attempts: 0
    base_delay_ms: 1000
    max_delay_ms: 1000
  rate_limit:
    requests_per_minute: 1
    items_per_run: null
  pagination:
    strategy: none
    page_parameter: null
    cursor_json_path: null
    next_link_json_path: null
    checkpoint_field: null
  query:
    keywords: []
    locations: []
    work_modes: [REMOTE, HYBRID, ONSITE, UNKNOWN]
    lane_keys: []
mapping:
  external_id: $.mcfJobUuid
  title: $.title
  company: $.company
  description: $.description
  url: $.url
  location: $.location
  work_mode: $context.unknown
  employment_type: $.employmentType
  posted_at: $.postedAt
  updated_at: null

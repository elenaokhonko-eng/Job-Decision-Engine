schema_version: "2.2.0"
source_key: himalayas
display_name: Himalayas jobs feed
kind: json_api
status: active
capabilities:
  discovery: true
  pagination: false
  incremental: false
  location_filter: false
  work_mode_evidence: true
compliance:
  access_basis: public_feed
  terms_url: https://himalayas.app/
  license: null
  attribution_required: true
  attribution_text: Use canonical Himalayas URL attribution for each posting.
  authenticated_scraping: false
  reviewed_at: "2026-09-06"
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 180
request:
  endpoint: https://himalayas.app/jobs/api
  timeout_ms: 15000
  headers_from_secret_keys: []
  retry:
    max_attempts: 2
    base_delay_ms: 1000
    max_delay_ms: 30000
  rate_limit:
    requests_per_minute: 20
    items_per_run: 30
  pagination:
    strategy: none
    page_parameter: null
    cursor_json_path: null
    next_link_json_path: null
    checkpoint_field: null
  query:
    keywords: [ai, data, software]
    locations: []
    work_modes: [REMOTE, HYBRID, ONSITE, UNKNOWN]
    lane_keys: [CORE_AI_DATA, LEGAL_REGTECH, HEALTH_BIO_PHARMA, INVESTMENT_MARKETS_FINTECH]
mapping:
  external_id: $.id
  title: $.title
  company: $.companyName
  description: $.description
  url: $.jobUrl
  location: $.location
  work_mode: $.workplaceType
  employment_type: $.employmentType
  posted_at: null
  updated_at: null


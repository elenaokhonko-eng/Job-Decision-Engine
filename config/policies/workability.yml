schema_version: "2.2.0"
policy_version: "workability_v3"
description: "Funnel V3 pre-lane workability hard gates and constraints"

global_workability_gates:
  work_mode:
    onsite_only_allowed: false
    max_office_days_per_week: 3
    max_office_days_hard_fail: 4
    hybrid_without_office_days_allowed: true
    # An unestablished workplace model is unresolved evidence, not a career conflict.
    unknown_work_mode_policy: NEEDS_VERIFICATION
    # On-site exceptions. A full-time on-site role is still rejected unless one
    # applies. Research and university roles qualify because researchers'
    # on-site attendance is effectively hybrid. This public list holds no
    # personal data; user-preferred employers come only from the stage3
    # preference field mobility.onsite_exception_employers.
    onsite_exceptions:
      research_employers:
        - nanyang technological university
        - ntu
        - national university of singapore
        - nus
        - duke-nus
        - a*star
        - agency for science, technology and research
        - singapore institute of technology
        - sit
        - singapore university of technology and design
        - sutd
        - singapore management university
        - smu
        - singapore university of social sciences
        - suss
        - singapore-mit alliance for research and technology
        - institute for infocomm research
        - genome institute of singapore
        - bioinformatics institute
        - centre for quantum technologies
        - lee kong chian school of medicine
      # Employer-name words that mark other universities and research institutes.
      research_employer_name_terms:
        - university
        - universiti
        - polytechnic
        - research institute
        - research centre
        - research center
        - institute of technology
      # Hospital and health bodies qualify through their research units.
      health_research_employers:
        - singhealth
        - singapore health services
        - tan tock seng hospital
        - national university health system
        - nuhs
        - national healthcare group
        - national university hospital
        - singapore general hospital
        - national cancer centre singapore
        - changi general hospital
        - khoo teck puat hospital
      health_research_unit_terms:
        - research
        - lab
        - laboratory
        - institute
        - innovation
        - clinical trials
        - centre of excellence
      research_title_terms:
        - research engineer
        - research fellow
        - research scientist
        - research associate
        - research assistant
        - postdoc
        - postdoctoral
        - scientist
      # "Data scientist" is an industry analytics title, not a research role.
      research_title_exclusions:
        - data scientist

  territory:
    # Default profile policy. User preference modes can override this list.
    authorized_regions:
      - SINGAPORE
    remote_without_territory_allowed: true
    reject_explicit_foreign_territory: true
    unknown_work_authorization_needs_verification: false

  employment:
    # Direct fixed-term hires remain eligible; third-party agency placements do not.
    contract_allowed: true
    reject_agency_placement_contracts: true
    employment_agency_company_names:
      - adecco
      - allegis group
      - charterhouse
      - hays
      - hudson
      - kelly services
      - manpower
      - manpowergroup
      - michael page
      - morgan mckinley
      - pagegroup
      - persolkelly
      - randstad
      - recruit express
      - robert walters
      - talentvis

  operations:
    regular_on_call_allowed: false
    shift_work_allowed: false
    frequent_travel_allowed: false
  travel:
    # A fixed requirement at 20% passes; a range whose upper bound exceeds
    # 20% rejects (for example, 20-30%). Qualitative minimal travel is accepted
    # as a policy assumption without inventing a numeric percentage.
    max_travel_pct: 20
    minimal_qualitative_travel_allowed: true

  work_composition:
    minimum_building_research_pct: 60
    maximum_interaction_pct: 60
    preferred_building_research_pct: 85
    preferred_interaction_pct: 15
    external_client_primary_allowed: false
    people_management_primary_allowed: false

blacklisted_companies: []

decision_outcomes:
  HARD_REJECTED: "Deterministic conflict with work preferences"
  NEEDS_VERIFICATION: "Ambiguous or unknown workability fact"
  OUT_OF_SCOPE: "Lane disabled or budget exhausted"
  INSUFFICIENT_EVIDENCE: "Verified evidence below threshold"
  PREQUALIFIED: "Meets all mandatory criteria"
  STRONG_MATCH: "High capability alignment"
  PRIORITY_APPLY: "Strategic priority or best match"

schema_version: "2.2.0"
policy_version: "workability_v2"
description: "Pre-lane workability hard gates and constraints"

global_workability_gates:
  work_mode:
    onsite_only_allowed: false
    max_office_days_per_week: 3
    max_office_days_hard_fail: 4
    hybrid_without_office_days_allowed: true
    # Safe default: an unstated work mode is not invented as a pass or reject.
    # Set to PASS or HARD_REJECT only as an explicit user policy choice.
    unknown_work_mode_policy: NEEDS_VERIFICATION

  territory:
    # Default profile policy. User preference modes can override this list.
    authorized_regions:
      - SINGAPORE
    remote_without_territory_allowed: true
    reject_explicit_foreign_territory: true
    unknown_work_authorization_needs_verification: false

  operations:
    regular_on_call_allowed: false
    shift_work_allowed: false
    frequent_travel_allowed: false
  travel:
    max_travel_pct: 10

  work_composition:
    minimum_building_research_pct: 60
    maximum_interaction_pct: 40
    external_client_primary_allowed: false
    people_management_primary_allowed: false

blacklisted_companies: []

decision_outcomes:
  HARD_REJECTED: "Deterministic conflict with work preferences"
  NEEDS_VERIFICATION: "Ambiguous or unknown workability fact"
  OUT_OF_SCOPE: "Lane disabled or budget exhausted"
  INSUFFICIENT_EVIDENCE: "Verified evidence below threshold"
  PREQUALIFIED: "Meets all mandatory criteria"
  STRONG_MATCH: "High capability alignment"
  PRIORITY_APPLY: "Strategic priority or best match"

  - id: P9
    title: Model routes and document plugins
    status: pending
    depends_on: [P3, P6, P8]
    migrations: [029, 030]
    deliverables: [route_snapshots, plugin_versions, deterministic_claim_selection]
    gate: provenance_complete_documents
  - id: P10
    title: API and product integration
    status: pending
    depends_on: [P3, P5, P6, P7, P8, P9]
    migrations: []
    deliverables: [v2_api, cursor_read_model, streamlit_workflows]
    gate: browser_e2e_green
  - id: P12
    title: Source plugin SDK and compliant discovery
    status: pending
    depends_on: [P2]
    migrations: [031, 032]
    deliverables: [source_revisions, connector_accounts, checkpoints, compliant_connectors, discovery_health]
    gate: source_contract_fixtures_green
  - id: P13
    title: Accessible neuroinclusive product
    status: pending
    depends_on: [P10]
    migrations: [033, 034]
    deliverables: [wcag_22_aa_baseline, quiet_mode, preference_modes, consent_controls, usability_tests]
    gate: accessibility_walkthrough_green
  - id: P11
    title: Backfill parity and cutover
    status: pending
    depends_on: [P0, P1, P2, P3, P4, P5, P6, P7, P8, P9, P10, P12, P13]
    migrations: [035]
    deliverables: [resumable_backfill, parity_audit, runbooks, release_tag]
    gate: v22_definition_of_done
  - id: P14
    title: Open-source trust and adoption release
    status: pending
    depends_on: [P11]
    migrations: []
    deliverables: [one_command_install, synthetic_demo, docs_pack, compliance_matrix, sbom_signed_release, public_benchmarks]
    gate: v22_adoption_release_exit

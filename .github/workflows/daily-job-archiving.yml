name: Daily Job Archiving

# Two independent archive rules run in one scan (scripts/archive_jobs.ts --rule):
#   hard-rejected  HARD_REJECTED_PERMANENT: deterministic hard rejections with stored reason codes,
#                  never the owner's LINKEDIN_SAVED / MCF_SAVED jobs, archived the day they are rejected.
#   age            JOB_OLDER_THAN_THREE_CALENDAR_MONTHS (unchanged).
#
# Scheduled runs evaluate vars.JOB_ARCHIVING_RULE (default all). They APPLY only when
# JOB_ARCHIVING_ENABLED is true and either JOB_ARCHIVING_PILOT_COMPLETE is true or the scheduled
# rule is hard-rejected (that rule does not need the age rule's live-job pilot); otherwise DRY_RUN.

on:
  schedule:
    - cron: "15 19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Archive mode. Apply requires JOB_ARCHIVING_ENABLED=true (and JOB_ARCHIVING_PILOT_COMPLETE=true unless rule is hard-rejected)."
        type: choice
        options:
          - DRY_RUN
          - APPLY
        default: DRY_RUN
        required: true
      rule:
        description: "Archive rules to evaluate."
        type: choice
        options:
          - all
          - hard-rejected
          - age
        default: all
        required: true
      max_archives:
        description: "Archive cap per rule for this run (1-10000). Scheduled runs always use 500."
        type: string
        default: "500"
        required: true

concurrency:
  group: job-decision-daily-archiving
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-manual-dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate production ref and archive dispatch inputs
        env:
          REQUESTED_REF: ${{ github.ref }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_RULE: ${{ inputs.rule }}
          INPUT_MAX_ARCHIVES: ${{ inputs.max_archives }}
          WORKFLOW_KILL_SWITCH: ${{ vars.WORKFLOW_KILL_SWITCH || 'false' }}
          JOB_ARCHIVING_ENABLED: ${{ vars.JOB_ARCHIVING_ENABLED || 'false' }}
          JOB_ARCHIVING_PILOT_COMPLETE: ${{ vars.JOB_ARCHIVING_PILOT_COMPLETE || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REQUESTED_REF" != "refs/heads/main" ]]; then
            echo "Production archive workflows may only run reviewed code from main." >&2
            exit 1
          fi
          if [[ "$INPUT_MODE" != "DRY_RUN" && "$INPUT_MODE" != "APPLY" ]]; then
            echo "Archive mode must be DRY_RUN or APPLY." >&2
            exit 1
          fi
          if [[ "$INPUT_RULE" != "all" && "$INPUT_RULE" != "hard-rejected" && "$INPUT_RULE" != "age" ]]; then
            echo "Archive rule must be all, hard-rejected or age." >&2
            exit 1
          fi
          if ! [[ "$INPUT_MAX_ARCHIVES" =~ ^[1-9][0-9]{0,4}$ ]] || (( INPUT_MAX_ARCHIVES > 10000 )); then
            echo "max_archives must be an integer from 1 to 10000." >&2
            exit 1
          fi
          if [[ "$INPUT_MODE" == "APPLY" ]]; then
            if [[ "$WORKFLOW_KILL_SWITCH" == "true" ]]; then
              echo "Archive APPLY dispatch is disabled while WORKFLOW_KILL_SWITCH=true." >&2
              exit 1
            fi
            if [[ "$JOB_ARCHIVING_ENABLED" != "true" ]]; then
              echo "Archive APPLY dispatch requires JOB_ARCHIVING_ENABLED=true." >&2
              exit 1
            fi
            if [[ "$INPUT_RULE" != "hard-rejected" && "$JOB_ARCHIVING_PILOT_COMPLETE" != "true" ]]; then
              echo "Archive APPLY dispatch with the age rule requires JOB_ARCHIVING_ENABLED=true and JOB_ARCHIVING_PILOT_COMPLETE=true." >&2
              exit 1
            fi
          fi

  archive_jobs:
    name: Archive hard-rejected and aged canonical jobs
    needs: validate-manual-dispatch
    runs-on: ubuntu-latest
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || needs.validate-manual-dispatch.result == 'success') && github.ref == 'refs/heads/main' && vars.WORKFLOW_KILL_SWITCH != 'true' }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install Node.js dependencies
        run: npm ci
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          npx tsx scripts/preflight_database.ts
          npx tsx src/db/migrate.ts
      - name: Run daily archive scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          WORKFLOW_KILL_SWITCH: ${{ vars.WORKFLOW_KILL_SWITCH || 'false' }}
          JOB_ARCHIVING_ENABLED: ${{ vars.JOB_ARCHIVING_ENABLED || 'false' }}
          JOB_ARCHIVING_PILOT_COMPLETE: ${{ vars.JOB_ARCHIVING_PILOT_COMPLETE || 'false' }}
          JOB_ARCHIVE_PILOT_CANONICAL_JOB_ID: ${{ vars.JOB_ARCHIVE_PILOT_CANONICAL_JOB_ID || '' }}
          ARCHIVE_RULE: ${{ github.event_name == 'schedule' && (vars.JOB_ARCHIVING_RULE || 'all') || inputs.rule }}
          ARCHIVE_MODE: ${{ github.event_name == 'schedule' && (vars.JOB_ARCHIVING_ENABLED == 'true' && (vars.JOB_ARCHIVING_PILOT_COMPLETE == 'true' || vars.JOB_ARCHIVING_RULE == 'hard-rejected') && 'APPLY' || 'DRY_RUN') || inputs.mode }}
          ARCHIVE_MAX_ARCHIVES: ${{ github.event_name == 'schedule' && '500' || inputs.max_archives }}
        run: npx tsx scripts/archive_jobs.ts --mode "${ARCHIVE_MODE}" --rule "${ARCHIVE_RULE}" --page-size 250 --max-archives "${ARCHIVE_MAX_ARCHIVES}"

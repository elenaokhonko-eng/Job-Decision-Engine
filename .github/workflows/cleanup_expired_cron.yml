name: Weekly Expired Jobs Cleanup

on:
  schedule:
    # Runs every Sunday at 03:00 UTC (11:00 AM Singapore Time)
    - cron: '0 3 * * 0'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

jobs:
  cleanup-expired:
    name: Cleanup Expired Jobs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run Expired Jobs Cleanup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/cleanup_expired_jobs.ts

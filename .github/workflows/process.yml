name: Job Pipeline Processor

on:
  workflow_run:
    workflows: ["Job Discovery Ingestion"]
    types:
      - completed
  workflow_dispatch:

jobs:
  process-jobs:
    name: 2. Process, Normalize, Gate, and Budget
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run Pipeline Segregation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FLASH_API_KEY: ${{ secrets.GEMINI_FLASH_API_KEY }}
        run: npx tsx scripts/process_pipeline.ts

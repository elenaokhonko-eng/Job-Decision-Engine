name: Evaluation Queue Worker

on:
  schedule:
    - cron: '0 * * * *' # Run hourly
  workflow_dispatch:
    inputs:
      canonical_job_id:
        description: Canonical job UUID for the scoped pilot
        required: false
        type: string
      job_version_id:
        description: Current job version UUID for the scoped pilot
        required: false
        type: string

concurrency:
  group: evaluation-queue-worker
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-manual-dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate ref and scoped pilot inputs
        env:
          WORKFLOW_KILL_SWITCH: ${{ vars.WORKFLOW_KILL_SWITCH }}
          PILOT_MODE: ${{ vars.PILOT_MODE }}
          REQUESTED_REF: ${{ github.ref }}
          INPUT_CANONICAL_JOB_ID: ${{ inputs.canonical_job_id }}
          INPUT_JOB_VERSION_ID: ${{ inputs.job_version_id }}
        shell: bash
        run: |
          set -euo pipefail
          uuid_re='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          if [[ "$REQUESTED_REF" != "refs/heads/main" ]]; then
            echo "Production queue workflows may only run reviewed code from main." >&2
            exit 1
          fi
          case "$WORKFLOW_KILL_SWITCH" in
            ""|true|false) ;;
            *) echo "WORKFLOW_KILL_SWITCH must be exactly true, false, or unset." >&2; exit 1 ;;
          esac
          case "$PILOT_MODE" in
            ""|true|false) ;;
            *) echo "PILOT_MODE must be exactly true, false, or unset." >&2; exit 1 ;;
          esac
          if [[ "$WORKFLOW_KILL_SWITCH" == "true" ]]; then
            echo "WORKFLOW_KILL_SWITCH=true pauses all processing, including scoped pilots." >&2
            exit 1
          fi
          if [[ "$PILOT_MODE" == "true" ]]; then
            if [[ ! "$INPUT_CANONICAL_JOB_ID" =~ $uuid_re || ! "$INPUT_JOB_VERSION_ID" =~ $uuid_re ]]; then
              echo "PILOT_MODE=true requires valid canonical_job_id and job_version_id inputs." >&2
              exit 1
            fi
          elif [[ -n "$INPUT_CANONICAL_JOB_ID" || -n "$INPUT_JOB_VERSION_ID" ]]; then
            echo "Scoped pilot dispatches require PILOT_MODE=true." >&2
            exit 1
          fi

  evaluate-queue:
    name: Process Pending & Retrying Evaluations
    needs: validate-manual-dispatch
    runs-on: ubuntu-latest
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || needs.validate-manual-dispatch.result == 'success') && github.ref == 'refs/heads/main' && (vars.WORKFLOW_KILL_SWITCH == '' || vars.WORKFLOW_KILL_SWITCH == 'false') && (vars.PILOT_MODE == '' || vars.PILOT_MODE == 'false') }}
    # Gemini backend: AI Studio keys (default) or Vertex AI through Workload Identity Federation.
    permissions:
      contents: read
      id-token: write
    env:
      GEMINI_BACKEND: ${{ vars.GEMINI_BACKEND || 'studio' }}
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION || 'global' }}
      GEMINI_PIPELINE_FLEX: ${{ vars.GEMINI_PIPELINE_FLEX || 'false' }}
      # Flex PayGo calls only: per-request timeout (sent to Vertex as X-Server-Timeout) and the
      # per-call deadline covering Flex, one standard PayGo retry and the OpenAI fallback.
      GEMINI_FLEX_REQUEST_TIMEOUT_MS: ${{ vars.GEMINI_FLEX_REQUEST_TIMEOUT_MS || '600000' }}
      GEMINI_FLEX_CALL_DEADLINE_MS: ${{ vars.GEMINI_FLEX_CALL_DEADLINE_MS || '900000' }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Authenticate to Google Cloud for Vertex AI
        if: ${{ vars.GEMINI_BACKEND == 'vertex' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GOOGLE_CLOUD_PROJECT }}

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          npx tsx scripts/preflight_database.ts
          npx tsx src/db/migrate.ts

      - name: Run AI Evaluation Queue Processor
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.canonical_job_id == '' && inputs.job_version_id == '') }}
        # The processor stops starting evaluations after EVALUATION_QUEUE_WALL_CLOCK_MS (30 min); the
        # one in flight ends within its call deadline (15 min on Flex: a 10 min Flex request, a 1 min
        # standard retry, then OpenAI). 30 + 15 + 5 min for startup and persistence = 50.
        timeout-minutes: 50
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FLASH_API_KEY: ${{ secrets.GEMINI_FLASH_API_KEY }}
          GEMINI_API_VERSION: ${{ vars.GEMINI_API_VERSION || 'v1beta' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVALUATION_PRIMARY_PROVIDER: ${{ vars.EVALUATION_PRIMARY_PROVIDER || 'openai' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-sol' }}
          EVALUATION_FALLBACK_MODEL: ${{ vars.EVALUATION_FALLBACK_MODEL || '' }}
          DOCUMENT_FALLBACK_MODEL: ${{ vars.DOCUMENT_FALLBACK_MODEL || '' }}
          MODEL_REQUEST_MAX_RETRIES: ${{ vars.MODEL_REQUEST_MAX_RETRIES || '3' }}
          MODEL_REQUEST_TIMEOUT_MS: ${{ vars.MODEL_REQUEST_TIMEOUT_MS || '60000' }}
          EVALUATION_QUEUE_WALL_CLOCK_MS: ${{ vars.EVALUATION_QUEUE_WALL_CLOCK_MS || '1800000' }}
          EVALUATION_EXIT_ON_RETRY_WAIT: "false"
        run: npx tsx scripts/evaluate_queue.ts

      - name: Materialize current application rankings
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || (inputs.canonical_job_id == '' && inputs.job_version_id == '')) }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: npx tsx scripts/materialize_application_rankings.ts

  scoped-pilot:
    name: Run one-job production pilot
    needs: validate-manual-dispatch
    runs-on: ubuntu-latest
    if: ${{ always() && needs.validate-manual-dispatch.result == 'success' && (vars.WORKFLOW_KILL_SWITCH == '' || vars.WORKFLOW_KILL_SWITCH == 'false') && vars.PILOT_MODE == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.canonical_job_id != '' && inputs.job_version_id != '' }}
    timeout-minutes: 60
    # Gemini backend: AI Studio keys (default) or Vertex AI through Workload Identity Federation.
    permissions:
      contents: read
      id-token: write
    env:
      GEMINI_BACKEND: ${{ vars.GEMINI_BACKEND || 'studio' }}
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION || 'global' }}
      GEMINI_PIPELINE_FLEX: ${{ vars.GEMINI_PIPELINE_FLEX || 'false' }}
      # Flex PayGo calls only: per-request timeout (sent to Vertex as X-Server-Timeout) and the
      # per-call deadline covering Flex, one standard PayGo retry and the OpenAI fallback.
      GEMINI_FLEX_REQUEST_TIMEOUT_MS: ${{ vars.GEMINI_FLEX_REQUEST_TIMEOUT_MS || '600000' }}
      GEMINI_FLEX_CALL_DEADLINE_MS: ${{ vars.GEMINI_FLEX_CALL_DEADLINE_MS || '900000' }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Authenticate to Google Cloud for Vertex AI
        if: ${{ vars.GEMINI_BACKEND == 'vertex' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GOOGLE_CLOUD_PROJECT }}

      - name: Verify the production schema before scoped execution
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          npx tsx scripts/preflight_database.ts
          npx tsx scripts/verify_migration_status.ts

      - name: Process only the selected job version
        # Stage worker: 15 min budget plus one in-flight Flex call (15 min deadline); then one
        # evaluation (15 min deadline on Flex); plus 5 min of setup = 50.
        timeout-minutes: 50
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          WORKFLOW_KILL_SWITCH: ${{ vars.WORKFLOW_KILL_SWITCH }}
          PILOT_MODE: ${{ vars.PILOT_MODE }}
          PILOT_CANONICAL_JOB_ID: ${{ inputs.canonical_job_id }}
          PILOT_JOB_VERSION_ID: ${{ inputs.job_version_id }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FLASH_API_KEY: ${{ secrets.GEMINI_FLASH_API_KEY }}
          GEMINI_API_VERSION: ${{ vars.GEMINI_API_VERSION || 'v1beta' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVALUATION_PRIMARY_PROVIDER: ${{ vars.EVALUATION_PRIMARY_PROVIDER || 'openai' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-sol' }}
          EVALUATION_FALLBACK_MODEL: ${{ vars.EVALUATION_FALLBACK_MODEL || '' }}
          DOCUMENT_FALLBACK_MODEL: ${{ vars.DOCUMENT_FALLBACK_MODEL || '' }}
          MODEL_REQUEST_MAX_RETRIES: ${{ vars.MODEL_REQUEST_MAX_RETRIES || '3' }}
          MODEL_REQUEST_TIMEOUT_MS: ${{ vars.MODEL_REQUEST_TIMEOUT_MS || '60000' }}
        run: npx tsx scripts/run_scoped_pilot.ts --canonical-job-id "$PILOT_CANONICAL_JOB_ID" --job-version-id "$PILOT_JOB_VERSION_ID"

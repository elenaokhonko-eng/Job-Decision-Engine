name: Job Decision Engine CI

on:
  push:
    branches: [ main, master, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Reject UTF-8 BOM in executable and migration sources
      shell: bash
      run: |
        set +e
        matches=$(grep -rIl --include='*.sql' --include='*.yml' --include='*.yaml' --include='*.ts' --include='*.py' "$(printf '\357\273\277')" .)
        grep_status=$?
        set -e
        if [ "$grep_status" -gt 1 ]; then
          exit "$grep_status"
        fi
        if [ -n "$matches" ]; then
          echo "UTF-8 BOM found in files that are parsed by runtime tooling:"
          echo "$matches"
          exit 1
        fi

    - name: Validate GitHub Actions workflows
      run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

    - name: Run linter checks
      run: npm run lint

    - name: Initialize Database
      env:
        DATABASE_URL: postgres://test:password@localhost:5432/testdb
      run: npm run db:init

    - name: Run Vitest Unit Tests
      env:
        DATABASE_URL: postgres://test:password@localhost:5432/testdb
      run: npm run test

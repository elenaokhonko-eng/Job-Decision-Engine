name: Weekly AshbyHQ (Protege) Job Ingestion & Evaluation

on:
  schedule:
    # Runs weekly on Sundays at 03:00 UTC (11:00 AM Singapore Time)
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  ingest-ashbyhq:
    name: 1. Ingest AshbyHQ (Protege) Jobs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run AshbyHQ Ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/ingest_ashbyhq.ts

  evaluate-jobs:
    name: 2. Evaluate Staged Jobs via AI Engine
    needs: ingest-ashbyhq
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run AI Evaluation Engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORCE_OPENAI: ${{ secrets.FORCE_OPENAI }}
          IMAP_USER: ${{ secrets.GMAIL_USER }}
          IMAP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_FOLDER: ${{ secrets.GMAIL_FOLDER }}
          GMAIL_PROCESSED_FOLDER: ${{ secrets.GMAIL_PROCESSED_FOLDER }}
        run: npx tsx scripts/evaluate_jobs.ts

name: Job Discovery Ingestion

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  # Ingestion and pipeline processing share durable leases and the same
  # database-backed task worker. A newer dispatch must wait for the active
  # run; cancelling it mid-stage can strand work in RUNNING until lease expiry.
  group: job-decision-pipeline
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gmail_ingestion:
    name: Ingest Gmail job alerts
    runs-on: ubuntu-latest
    if: ${{ vars.WORKFLOW_KILL_SWITCH != 'true' }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install Node.js dependencies
        run: npm ci
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx src/db/migrate.ts
      - name: Run Gmail API alert ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
          GMAIL_FOLDER: ${{ vars.GMAIL_FOLDER || 'Jobs-Alerts' }}
          GMAIL_PROCESSED_FOLDER: ${{ vars.GMAIL_PROCESSED_FOLDER || 'Jobs-Alerts-Processed' }}
          GMAIL_READ_ONLY: ${{ vars.GMAIL_READ_ONLY || 'false' }}
          GMAIL_INGEST_MAX_ATTEMPTS: ${{ vars.GMAIL_INGEST_MAX_ATTEMPTS || '3' }}
        run: npx tsx scripts/ingest_gmail.ts
      - name: Run LLM email parser
        timeout-minutes: 10
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FLASH_API_KEY: ${{ secrets.GEMINI_FLASH_API_KEY }}
          GEMINI_API_VERSION: ${{ vars.GEMINI_API_VERSION || 'v1beta' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVALUATION_PRIMARY_PROVIDER: ${{ vars.EVALUATION_PRIMARY_PROVIDER || 'openai' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-sol' }}
          MODEL_REQUEST_MAX_RETRIES: ${{ vars.MODEL_REQUEST_MAX_RETRIES || '3' }}
          MODEL_REQUEST_TIMEOUT_MS: ${{ vars.MODEL_REQUEST_TIMEOUT_MS || '60000' }}
        run: npx tsx scripts/parse_emails.ts

  public_source_ingestion:
    name: Ingest public job sources
    runs-on: ubuntu-latest
    if: ${{ vars.WORKFLOW_KILL_SWITCH != 'true' }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install Node.js dependencies
        run: npm ci
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx src/db/migrate.ts
      - name: Sync source plugin manifests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/load_source_plugins.ts
      - name: Run unified ATS and job-board adapters
        timeout-minutes: 10
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/run_adapters.ts

  process_pipeline:
    name: Run Job Decision Pipeline
    runs-on: ubuntu-latest
    needs: [gmail_ingestion, public_source_ingestion]
    if: ${{ vars.WORKFLOW_KILL_SWITCH != 'true' && always() && (needs.gmail_ingestion.result == 'success' || needs.public_source_ingestion.result == 'success') }}
    timeout-minutes: 35
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install Node.js dependencies
        run: npm ci
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx src/db/migrate.ts
      - name: Verify configured model routes
        timeout-minutes: 5
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FLASH_API_KEY: ${{ secrets.GEMINI_FLASH_API_KEY }}
          GEMINI_API_VERSION: ${{ vars.GEMINI_API_VERSION || 'v1beta' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVALUATION_PRIMARY_PROVIDER: ${{ vars.EVALUATION_PRIMARY_PROVIDER || 'openai' }}
          DOCUMENT_PRIMARY_PROVIDER: ${{ vars.DOCUMENT_PRIMARY_PROVIDER || 'openai' }}
          REQUIREMENTS_PRIMARY_PROVIDER: ${{ vars.REQUIREMENTS_PRIMARY_PROVIDER || 'openai' }}
          EMBEDDING_PRIMARY_PROVIDER: ${{ vars.EMBEDDING_PRIMARY_PROVIDER || 'gemini' }}
          EMBEDDING_FALLBACK_PROVIDER: ${{ vars.EMBEDDING_FALLBACK_PROVIDER || 'openai' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-sol' }}
          REQUIREMENTS_OPENAI_MODEL: ${{ vars.REQUIREMENTS_OPENAI_MODEL || 'gpt-5.6-luna' }}
          REQUIREMENTS_GEMINI_MODEL: ${{ vars.REQUIREMENTS_GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          EVALUATION_PRIMARY_MODEL: ${{ vars.EVALUATION_PRIMARY_MODEL }}
          EVALUATION_FALLBACK_MODEL: ${{ vars.EVALUATION_FALLBACK_MODEL }}
          EMBEDDING_PRIMARY_MODEL: ${{ vars.EMBEDDING_PRIMARY_MODEL || 'gemini-embedding-001' }}
          EMBEDDING_FALLBACK_MODEL: ${{ vars.EMBEDDING_FALLBACK_MODEL || 'text-embedding-3-small' }}
          EMBEDDING_PRIMARY_DIMENSIONS: ${{ vars.EMBEDDING_PRIMARY_DIMENSIONS || '768' }}
          EMBEDDING_FALLBACK_DIMENSIONS: ${{ vars.EMBEDDING_FALLBACK_DIMENSIONS || '1536' }}
          DOCUMENT_PRIMARY_MODEL: ${{ vars.DOCUMENT_PRIMARY_MODEL }}
          DOCUMENT_FALLBACK_MODEL: ${{ vars.DOCUMENT_FALLBACK_MODEL }}
          MODEL_REQUEST_MAX_RETRIES: ${{ vars.MODEL_REQUEST_MAX_RETRIES || '3' }}
          MODEL_REQUEST_TIMEOUT_MS: ${{ vars.MODEL_REQUEST_TIMEOUT_MS || '60000' }}
          REQUIREMENTS_ENABLE_QUOTED: 'true'
        run: npx tsx scripts/preflight_models.ts
      - name: Process discovery pipeline
        timeout-minutes: 15
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FLASH_API_KEY: ${{ secrets.GEMINI_FLASH_API_KEY }}
          GEMINI_API_VERSION: ${{ vars.GEMINI_API_VERSION || 'v1beta' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVALUATION_PRIMARY_PROVIDER: ${{ vars.EVALUATION_PRIMARY_PROVIDER || 'openai' }}
          REQUIREMENTS_PRIMARY_PROVIDER: ${{ vars.REQUIREMENTS_PRIMARY_PROVIDER || 'openai' }}
          EMBEDDING_PRIMARY_PROVIDER: ${{ vars.EMBEDDING_PRIMARY_PROVIDER || 'gemini' }}
          EMBEDDING_FALLBACK_PROVIDER: ${{ vars.EMBEDDING_FALLBACK_PROVIDER || 'openai' }}
          EMBEDDING_PRIMARY_MODEL: ${{ vars.EMBEDDING_PRIMARY_MODEL || 'gemini-embedding-001' }}
          EMBEDDING_FALLBACK_MODEL: ${{ vars.EMBEDDING_FALLBACK_MODEL || 'text-embedding-3-small' }}
          EMBEDDING_PRIMARY_DIMENSIONS: ${{ vars.EMBEDDING_PRIMARY_DIMENSIONS || '768' }}
          EMBEDDING_FALLBACK_DIMENSIONS: ${{ vars.EMBEDDING_FALLBACK_DIMENSIONS || '1536' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-sol' }}
          REQUIREMENTS_OPENAI_MODEL: ${{ vars.REQUIREMENTS_OPENAI_MODEL || 'gpt-5.6-luna' }}
          REQUIREMENTS_GEMINI_MODEL: ${{ vars.REQUIREMENTS_GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          MODEL_REQUEST_MAX_RETRIES: ${{ vars.MODEL_REQUEST_MAX_RETRIES || '3' }}
          MODEL_REQUEST_TIMEOUT_MS: ${{ vars.MODEL_REQUEST_TIMEOUT_MS || '60000' }}
          REQUIREMENTS_PROVIDER_FAILURE_LIMIT: ${{ vars.REQUIREMENTS_PROVIDER_FAILURE_LIMIT || '1' }}
          REQUIREMENTS_DB_STATEMENT_TIMEOUT_MS: ${{ vars.REQUIREMENTS_DB_STATEMENT_TIMEOUT_MS || '60000' }}
          REQUIREMENTS_ENABLE_QUOTED: 'true'
          PIPELINE_TASK_WORKER_MAX_TASKS: ${{ vars.PIPELINE_TASK_WORKER_MAX_TASKS || '40' }}
          PIPELINE_TASK_WORKER_WALL_CLOCK_MS: ${{ vars.PIPELINE_TASK_WORKER_WALL_CLOCK_MS || '720000' }}
          PIPELINE_TASK_WORKER_LEASE_SECONDS: ${{ vars.PIPELINE_TASK_WORKER_LEASE_SECONDS || '300' }}
          PIPELINE_TASK_WORKER_HEARTBEAT_SECONDS: ${{ vars.PIPELINE_TASK_WORKER_HEARTBEAT_SECONDS || '60' }}
          PIPELINE_TASK_WORKER_CLAIM_BATCH_SIZE: ${{ vars.PIPELINE_TASK_WORKER_CLAIM_BATCH_SIZE || '1' }}
          PIPELINE_TASK_WORKER_MAX_SEED_PER_TYPE: ${{ vars.PIPELINE_TASK_WORKER_MAX_SEED_PER_TYPE || '500' }}
          PIPELINE_TASK_WORKER_EXIT_ON_RETRY_WAIT: ${{ vars.PIPELINE_TASK_WORKER_EXIT_ON_RETRY_WAIT || 'true' }}
          PIPELINE_TASK_WORKER_SHUTDOWN_GRACE_MS: ${{ vars.PIPELINE_TASK_WORKER_SHUTDOWN_GRACE_MS || '10000' }}
        run: npx tsx scripts/process_pipeline_tasks.ts
      - name: Run AI evaluation queue processor
        timeout-minutes: 15
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_VERSION: ${{ vars.GEMINI_API_VERSION || 'v1beta' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVALUATION_PRIMARY_PROVIDER: ${{ vars.EVALUATION_PRIMARY_PROVIDER || 'openai' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-sol' }}
          MODEL_REQUEST_MAX_RETRIES: ${{ vars.MODEL_REQUEST_MAX_RETRIES || '3' }}
          MODEL_REQUEST_TIMEOUT_MS: ${{ vars.MODEL_REQUEST_TIMEOUT_MS || '60000' }}
        run: npx tsx scripts/evaluate_queue.ts

name: Documents Generator

on:
  workflow_dispatch:
    inputs:
      canonical_job_id:
        description: Canonical job UUID
        required: false
        type: string
      job_version_id:
        description: Job version UUID (optional strict pin)
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-documents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run DB migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx src/db/migrate.ts

      - name: Resolve canonical_job_id/job_version_id (auto-pick if missing)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ inputs.canonical_job_id }}" ]]; then
            echo "CANONICAL_JOB_ID=${{ inputs.canonical_job_id }}" >> "$GITHUB_ENV"
            if [[ -n "${{ inputs.job_version_id }}" ]]; then
              echo "JOB_VERSION_ID=${{ inputs.job_version_id }}" >> "$GITHUB_ENV"
            fi
            exit 0
          fi

          echo "No canonical_job_id provided; selecting an eligible job automatically..."
          set +e
          OUT="$(npx tsx scripts/pick_documents_job.ts)"
          PICK_STATUS=$?
          set -e
          echo "$OUT"

          if [[ $PICK_STATUS -ne 0 ]]; then
            exit $PICK_STATUS
          fi

          CANONICAL="$(echo "$OUT" | sed -n 's/^canonical_job_id: //p' | head -n 1 | tr -d '\r')"
          VERSION="$(echo "$OUT" | sed -n 's/^job_version_id:[[:space:]]*//p' | head -n 1 | tr -d '\r')"

          if [[ -z "$CANONICAL" || -z "$VERSION" ]]; then
            echo "Failed to parse canonical_job_id/job_version_id from pick_documents_job output." >&2
            exit 1
          fi

          echo "CANONICAL_JOB_ID=$CANONICAL" >> "$GITHUB_ENV"
          echo "JOB_VERSION_ID=$VERSION" >> "$GITHUB_ENV"

      - name: Ensure exports directory exists
        run: mkdir -p scripts/exports

      - name: Generate customized CV
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FLASH_API_KEY: ${{ secrets.GEMINI_FLASH_API_KEY }}
          GEMINI_API_VERSION: ${{ vars.GEMINI_API_VERSION }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DOCUMENT_PRIMARY_PROVIDER: ${{ vars.DOCUMENT_PRIMARY_PROVIDER || 'openai' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-sol' }}
          DOCUMENT_CONTACT_JSON: ${{ secrets.DOCUMENT_CONTACT_JSON }}
          MASTER_PROFILE_JSON: ${{ secrets.MASTER_PROFILE_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${JOB_VERSION_ID:-}" ]]; then
            npx tsx scripts/generate_cv.ts "$CANONICAL_JOB_ID" "$JOB_VERSION_ID"
          else
            npx tsx scripts/generate_cv.ts "$CANONICAL_JOB_ID"
          fi

      - name: Generate cover letter
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FLASH_API_KEY: ${{ secrets.GEMINI_FLASH_API_KEY }}
          GEMINI_API_VERSION: ${{ vars.GEMINI_API_VERSION }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DOCUMENT_PRIMARY_PROVIDER: ${{ vars.DOCUMENT_PRIMARY_PROVIDER || 'openai' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-sol' }}
          DOCUMENT_CONTACT_JSON: ${{ secrets.DOCUMENT_CONTACT_JSON }}
          MASTER_PROFILE_JSON: ${{ secrets.MASTER_PROFILE_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${JOB_VERSION_ID:-}" ]]; then
            npx tsx scripts/generate_cover_letter.ts "$CANONICAL_JOB_ID" "$JOB_VERSION_ID"
          else
            npx tsx scripts/generate_cover_letter.ts "$CANONICAL_JOB_ID"
          fi

      - name: Upload generated documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-documents-${{ inputs.canonical_job_id || 'auto' }}
          path: scripts/exports/
          if-no-files-found: warn
          retention-days: 3

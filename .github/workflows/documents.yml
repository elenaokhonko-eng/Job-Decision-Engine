name: Documents Generator

on:
  workflow_dispatch:
    inputs:
      canonical_job_id:
        description: Canonical job UUID
        required: true
        type: string
      job_version_id:
        description: Job version UUID (optional strict pin)
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-documents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run DB migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx src/db/migrate.ts

      - name: Generate customized CV
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FLASH_API_KEY: ${{ secrets.GEMINI_FLASH_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MASTER_PROFILE_JSON: ${{ secrets.MASTER_PROFILE_JSON }}
        run: npx tsx scripts/generate_cv.ts ${{ inputs.canonical_job_id }} ${{ inputs.job_version_id }}

      - name: Generate cover letter
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FLASH_API_KEY: ${{ secrets.GEMINI_FLASH_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MASTER_PROFILE_JSON: ${{ secrets.MASTER_PROFILE_JSON }}
        run: npx tsx scripts/generate_cover_letter.ts ${{ inputs.canonical_job_id }} ${{ inputs.job_version_id }}

      - name: Upload generated documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-documents-${{ inputs.canonical_job_id }}
          path: scripts/exports/
          if-no-files-found: error
          retention-days: 3

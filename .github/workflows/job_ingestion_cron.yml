name: Daily Job Ingestion & Evaluation

on:
  schedule:
    # Runs at 18:00 UTC daily (which is 2:00 AM Singapore Time)
    - cron: '0 18 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

jobs:
  ingest-and-evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: Run Gmail Ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_FOLDER: ${{ secrets.GMAIL_FOLDER }}
        run: python scripts/ingest_gmail.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run AI Evaluation Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/evaluate_jobs.ts

name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Desktop release channel
        required: true
        type: choice
        default: stable
        options:
          - stable
          - beta
          - alpha
      publish:
        description: Publish to GitHub Releases and enable update metadata
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.channel }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  desktop-release:
    name: Build Windows desktop installer
    runs-on: windows-latest
    if: ${{ vars.WORKFLOW_KILL_SWITCH != 'true' }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate desktop release policy
        shell: pwsh
        run: npm run desktop:release:validate -- --channel=${{ inputs.channel }} --publish=never

      - name: Run linter checks
        run: npm run lint

      - name: Run Vitest tests
        run: npm test

      - name: Verify desktop packaging configuration
        run: npm run desktop:verify

      - name: Prepare Windows direct PFX certificate (if configured)
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) {
            Write-Output "SIGNPATH_API_TOKEN is present; using SignPath Foundation signing pipeline."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            Write-Output "Neither SIGNPATH_API_TOKEN nor WINDOWS_CERTIFICATE_BASE64 configured; dry-run builds remain unsigned."
            exit 0
          }

          $certPath = Join-Path $env:RUNNER_TEMP "jdec-codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          "CSC_LINK=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CSC_KEY_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WIN_CSC_LINK=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WIN_CSC_KEY_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Strict publish readiness validation
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          JDEC_DESKTOP_ENABLE_UPDATES: true
        run: |
          if ("${{ inputs.publish }}" -ne "true") {
            Write-Output "Publish disabled; skipping strict signing/token validation."
            exit 0
          }

          npm run desktop:release:validate -- --strict --channel=${{ inputs.channel }} --publish=always

      - name: Build desktop installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JDEC_DESKTOP_OUTPUT_DIR: ${{ runner.temp }}\jdec-desktop-builds\${{ inputs.channel }}-${{ github.sha }}
          JDEC_DESKTOP_RELEASE_CHANNEL: ${{ inputs.channel }}
          JDEC_DESKTOP_ENABLE_UPDATES: ${{ inputs.publish == true && 'true' || 'false' }}
        run: |
          $publishArg = "--publish=never"
          if ("${{ inputs.publish }}" -eq "true" -and [string]::IsNullOrWhiteSpace("${{ secrets.SIGNPATH_API_TOKEN }}")) {
            $publishArg = "--publish=always"
          }
          npm run desktop:dist -- --channel=${{ inputs.channel }} $publishArg

      - name: Upload unsigned installer for SignPath signing
        id: upload-unsigned-installer
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer-${{ inputs.channel }}-${{ github.sha }}
          path: ${{ runner.temp }}\jdec-desktop-builds\${{ inputs.channel }}-${{ github.sha }}\*.exe
          if-no-files-found: error

      - name: Submit signing request to SignPath Foundation
        id: signpath-signing
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG || 'job-decision-engine' }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG || (inputs.channel == 'stable' && 'release-signing' || 'test-signing') }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}\signed-desktop-build

      - name: Apply signed installer and verify SignPath signature
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          OUTPUT_DIR: ${{ runner.temp }}\jdec-desktop-builds\${{ inputs.channel }}-${{ github.sha }}
          SIGNED_DIR: ${{ runner.temp }}\signed-desktop-build
        run: |
          $signedExe = Get-ChildItem -Path $env:SIGNED_DIR -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $signedExe) {
            throw "No signed .exe found in $env:SIGNED_DIR"
          }
          $targetPath = Join-Path $env:OUTPUT_DIR $signedExe.Name
          Copy-Item -Path $signedExe.FullName -Destination $targetPath -Force
          Write-Output "Applied signed binary to $targetPath"

          # Verify Authenticode Signature
          $sig = Get-AuthenticodeSignature -LiteralPath $targetPath
          Write-Output "Signature Status: $($sig.Status)"
          Write-Output "Signer Subject: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") {
            throw "Authenticode signature is invalid: $($sig.StatusMessage)"
          }
          if ($sig.SignerCertificate.Subject -notmatch "SignPath Foundation") {
            throw "Signer Subject does not match 'SignPath Foundation': $($sig.SignerCertificate.Subject)"
          }

      - name: Capture desktop release evidence
        shell: pwsh
        env:
          JDEC_DESKTOP_OUTPUT_DIR: ${{ runner.temp }}\jdec-desktop-builds\${{ inputs.channel }}-${{ github.sha }}
          JDEC_DESKTOP_RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          $publishArg = "never"
          if ("${{ inputs.publish }}" -eq "true") {
            $publishArg = "always"
          }
          npm run desktop:release:evidence -- --channel=${{ inputs.channel }} --publish=$publishArg --output-dir="$env:JDEC_DESKTOP_OUTPUT_DIR" --out="${{ runner.temp }}\desktop-release-evidence.md"

      - name: Publish release to GitHub (if SignPath and publish=true)
        if: ${{ inputs.publish == true && env.SIGNPATH_API_TOKEN != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          OUTPUT_DIR: ${{ runner.temp }}\jdec-desktop-builds\${{ inputs.channel }}-${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $files = Get-ChildItem -Path $env:OUTPUT_DIR | Where-Object { -not $_.PSIsContainer } | ForEach-Object { $_.FullName }
          Write-Output "Uploading signed release assets to GitHub release $env:TAG_NAME..."
          gh release upload $env:TAG_NAME $files --clobber

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ inputs.channel }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}\jdec-desktop-builds\**
            ${{ runner.temp }}\desktop-release-evidence.md
          if-no-files-found: error
          retention-days: 7

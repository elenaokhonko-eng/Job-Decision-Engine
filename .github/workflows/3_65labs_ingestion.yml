name: 3. 65labs Ingestion Only

on:
  workflow_dispatch:

jobs:
  ingest-65labs:
    name: Ingest 65labs Jobs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run 65labs Ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/ingest_65labs.ts

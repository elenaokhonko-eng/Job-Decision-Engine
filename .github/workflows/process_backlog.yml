name: Process Discovery Backlog

on:
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Job Discovery Ingestion
    types:
      - completed

concurrency:
  # Use the same repository-wide group as ingestion because both workflows
  # can invoke the pipeline task worker against the same database.
  group: job-decision-pipeline
  # A backlog drain owns leased database work. A scheduled run and the
  # post-ingestion workflow_run trigger may overlap; queue the later run so
  # it cannot terminate the active worker mid-stage and leave the drain
  # dependent on lease expiry/recovery.
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  process-backlog:
    name: Drain saved discovery backlog
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && vars.WORKFLOW_KILL_SWITCH != 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled') }}
    timeout-minutes: 55
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run database migrations
        id: database_migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          npx tsx scripts/preflight_database.ts
          npx tsx src/db/migrate.ts

      - name: Verify configured model routes
        timeout-minutes: 5
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FLASH_API_KEY: ${{ secrets.GEMINI_FLASH_API_KEY }}
          GEMINI_API_VERSION: ${{ vars.GEMINI_API_VERSION || 'v1beta' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVALUATION_PRIMARY_PROVIDER: ${{ vars.EVALUATION_PRIMARY_PROVIDER || 'openai' }}
          DOCUMENT_PRIMARY_PROVIDER: ${{ vars.DOCUMENT_PRIMARY_PROVIDER || 'openai' }}
          REQUIREMENTS_PRIMARY_PROVIDER: ${{ vars.REQUIREMENTS_PRIMARY_PROVIDER || 'openai' }}
          EMBEDDING_PRIMARY_PROVIDER: ${{ vars.EMBEDDING_PRIMARY_PROVIDER || 'gemini' }}
          EMBEDDING_FALLBACK_PROVIDER: ${{ vars.EMBEDDING_FALLBACK_PROVIDER || 'openai' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-sol' }}
          REQUIREMENTS_OPENAI_MODEL: ${{ vars.REQUIREMENTS_OPENAI_MODEL || 'gpt-5.6-luna' }}
          REQUIREMENTS_GEMINI_MODEL: ${{ vars.REQUIREMENTS_GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          EVALUATION_PRIMARY_MODEL: ${{ vars.EVALUATION_PRIMARY_MODEL }}
          EVALUATION_FALLBACK_MODEL: ${{ vars.EVALUATION_FALLBACK_MODEL }}
          EMBEDDING_PRIMARY_MODEL: ${{ vars.EMBEDDING_PRIMARY_MODEL || 'gemini-embedding-001' }}
          EMBEDDING_FALLBACK_MODEL: ${{ vars.EMBEDDING_FALLBACK_MODEL || 'text-embedding-3-small' }}
          EMBEDDING_PRIMARY_DIMENSIONS: ${{ vars.EMBEDDING_PRIMARY_DIMENSIONS || '768' }}
          EMBEDDING_FALLBACK_DIMENSIONS: ${{ vars.EMBEDDING_FALLBACK_DIMENSIONS || '1536' }}
          DOCUMENT_PRIMARY_MODEL: ${{ vars.DOCUMENT_PRIMARY_MODEL }}
          DOCUMENT_FALLBACK_MODEL: ${{ vars.DOCUMENT_FALLBACK_MODEL }}
          MODEL_REQUEST_MAX_RETRIES: ${{ vars.MODEL_REQUEST_MAX_RETRIES || '3' }}
          MODEL_REQUEST_TIMEOUT_MS: ${{ vars.MODEL_REQUEST_TIMEOUT_MS || '60000' }}
          REQUIREMENTS_ENABLE_QUOTED: 'true'
        run: npx tsx scripts/preflight_models.ts

      - name: Reconcile pipeline before drain
        timeout-minutes: 5
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/reconcile_pipeline.ts --json > pipeline-reconciliation-before.json

      - name: Process saved discovery backlog
        id: process_pipeline_worker
        timeout-minutes: 15
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FLASH_API_KEY: ${{ secrets.GEMINI_FLASH_API_KEY }}
          GEMINI_API_VERSION: ${{ vars.GEMINI_API_VERSION || 'v1beta' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVALUATION_PRIMARY_PROVIDER: ${{ vars.EVALUATION_PRIMARY_PROVIDER || 'openai' }}
          REQUIREMENTS_PRIMARY_PROVIDER: ${{ vars.REQUIREMENTS_PRIMARY_PROVIDER || 'openai' }}
          EMBEDDING_PRIMARY_PROVIDER: ${{ vars.EMBEDDING_PRIMARY_PROVIDER || 'gemini' }}
          EMBEDDING_FALLBACK_PROVIDER: ${{ vars.EMBEDDING_FALLBACK_PROVIDER || 'openai' }}
          EMBEDDING_PRIMARY_MODEL: ${{ vars.EMBEDDING_PRIMARY_MODEL || 'gemini-embedding-001' }}
          EMBEDDING_FALLBACK_MODEL: ${{ vars.EMBEDDING_FALLBACK_MODEL || 'text-embedding-3-small' }}
          EMBEDDING_PRIMARY_DIMENSIONS: ${{ vars.EMBEDDING_PRIMARY_DIMENSIONS || '768' }}
          EMBEDDING_FALLBACK_DIMENSIONS: ${{ vars.EMBEDDING_FALLBACK_DIMENSIONS || '1536' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-sol' }}
          REQUIREMENTS_OPENAI_MODEL: ${{ vars.REQUIREMENTS_OPENAI_MODEL || 'gpt-5.6-luna' }}
          REQUIREMENTS_GEMINI_MODEL: ${{ vars.REQUIREMENTS_GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          MODEL_REQUEST_MAX_RETRIES: ${{ vars.MODEL_REQUEST_MAX_RETRIES || '3' }}
          MODEL_REQUEST_TIMEOUT_MS: ${{ vars.MODEL_REQUEST_TIMEOUT_MS || '60000' }}
          REQUIREMENTS_PROVIDER_FAILURE_LIMIT: ${{ vars.REQUIREMENTS_PROVIDER_FAILURE_LIMIT || '1' }}
          REQUIREMENTS_DB_STATEMENT_TIMEOUT_MS: ${{ vars.REQUIREMENTS_DB_STATEMENT_TIMEOUT_MS || '60000' }}
          REQUIREMENTS_ENABLE_QUOTED: 'true'
          PIPELINE_TASK_WORKER_MAX_TASKS: ${{ vars.PIPELINE_TASK_WORKER_MAX_TASKS || '2500' }}
          PIPELINE_TASK_WORKER_STAGE_MAX_TASKS: ${{ vars.PIPELINE_TASK_WORKER_STAGE_MAX_TASKS || 'NORMALIZE_OBSERVATION=800,EXTRACT_DETERMINISTIC_REQUIREMENTS=800,APPLY_HARD_GATES=800,PUBLISH_EMBEDDING=400,ROUTE_LANE=400,MATCH_PROFILE_EVIDENCE=400,DECIDE_RECOMMENDATION=800,ENQUEUE_EXPLANATION=400' }}
          PIPELINE_TASK_WORKER_STAGE_QUANTUM: ${{ vars.PIPELINE_TASK_WORKER_STAGE_QUANTUM || '1' }}
          PIPELINE_TASK_WORKER_STALE_PENDING_RECONCILIATION_LIMIT: ${{ vars.PIPELINE_TASK_WORKER_STALE_PENDING_RECONCILIATION_LIMIT || '100' }}
          PIPELINE_TASK_WORKER_STALE_PENDING_RECONCILIATION_BUDGET_MS: ${{ vars.PIPELINE_TASK_WORKER_STALE_PENDING_RECONCILIATION_BUDGET_MS || '10000' }}
          PIPELINE_TASK_WORKER_RECONCILIATION_REPORT_FILE: pipeline-task-reconciliation.json
          PIPELINE_TASK_WORKER_WALL_CLOCK_MS: ${{ vars.PIPELINE_TASK_WORKER_WALL_CLOCK_MS || '600000' }}
          PIPELINE_TASK_WORKER_MIN_TIME_TO_START_TASK_MS: ${{ vars.PIPELINE_TASK_WORKER_MIN_TIME_TO_START_TASK_MS || '120000' }}
          PIPELINE_TASK_WORKER_LEASE_SECONDS: ${{ vars.PIPELINE_TASK_WORKER_LEASE_SECONDS || '300' }}
          PIPELINE_TASK_WORKER_HEARTBEAT_SECONDS: ${{ vars.PIPELINE_TASK_WORKER_HEARTBEAT_SECONDS || '60' }}
          PIPELINE_TASK_WORKER_CLAIM_BATCH_SIZE: ${{ vars.PIPELINE_TASK_WORKER_CLAIM_BATCH_SIZE || '1' }}
          PIPELINE_TASK_WORKER_MAX_SEED_PER_TYPE: ${{ vars.PIPELINE_TASK_WORKER_MAX_SEED_PER_TYPE || '200' }}
          PIPELINE_TASK_WORKER_SEED_BUDGET_MS: ${{ vars.PIPELINE_TASK_WORKER_SEED_BUDGET_MS || '15000' }}
          PIPELINE_TASK_WORKER_TASK_TYPES: ${{ vars.PIPELINE_TASK_WORKER_TASK_TYPES || '' }}
          PIPELINE_TASK_WORKER_DEAD_LETTER_REPORT_FILE: pipeline-dead-letter-health.json
          PIPELINE_TASK_WORKER_SEED: ${{ vars.PIPELINE_TASK_WORKER_SEED || 'true' }}
          PIPELINE_TASK_WORKER_INCLUDE_TEST_FIXTURES: 'false'
          # Deferred routing replay is opt-in; keep normal scheduled drains conservative.
          PIPELINE_TASK_WORKER_INCLUDE_ROUTING_DEFERRED: ${{ vars.PIPELINE_TASK_WORKER_INCLUDE_ROUTING_DEFERRED || 'true' }}
          PIPELINE_TASK_WORKER_ROUTING_DEFERRED_REPLAY_VERSION: ${{ vars.PIPELINE_TASK_WORKER_ROUTING_DEFERRED_REPLAY_VERSION || 'routing_deferred_replay_v1' }}
          PIPELINE_TASK_WORKER_EXIT_ON_RETRY_WAIT: 'false'
          PIPELINE_TASK_WORKER_MAX_RETRY_WAIT_COUNT: ${{ vars.PIPELINE_TASK_WORKER_MAX_RETRY_WAIT_COUNT || '500' }}
          PIPELINE_TASK_WORKER_MAX_RETRY_WAIT_AGE_SECONDS: ${{ vars.PIPELINE_TASK_WORKER_MAX_RETRY_WAIT_AGE_SECONDS || '21600' }}
          PIPELINE_TASK_WORKER_MAX_PENDING_AGE_SECONDS: ${{ vars.PIPELINE_TASK_WORKER_MAX_PENDING_AGE_SECONDS || '7200' }}
          PIPELINE_TASK_WORKER_NO_FORWARD_PROGRESS_PENDING_THRESHOLD: ${{ vars.PIPELINE_TASK_WORKER_NO_FORWARD_PROGRESS_PENDING_THRESHOLD || '1' }}
          PIPELINE_TASK_WORKER_SHUTDOWN_GRACE_MS: ${{ vars.PIPELINE_TASK_WORKER_SHUTDOWN_GRACE_MS || '60000' }}
        run: npx tsx scripts/process_pipeline_tasks.ts

      - name: Materialize current application rankings
        if: ${{ always() && steps.database_migrations.outcome == 'success' }}
        timeout-minutes: 5
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: npx tsx scripts/materialize_application_rankings.ts

      - name: Reconcile pipeline after drain
        if: ${{ always() }}
        timeout-minutes: 5
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/reconcile_pipeline.ts --json > pipeline-reconciliation-after.json

      - name: Reconcile terminal Gmail job alerts
        if: ${{ always() && steps.database_migrations.outcome == 'success' }}
        timeout-minutes: 20
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          GMAIL_RECONCILIATION_LIMIT: ${{ vars.GMAIL_RECONCILIATION_LIMIT || '2000' }}
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
          GMAIL_IN_PROCESSING_FOLDER: ${{ vars.GMAIL_IN_PROCESSING_FOLDER || 'Jobs-Alerts-In-Processing' }}
          GMAIL_PROCESSED_FOLDER: ${{ vars.GMAIL_PROCESSED_FOLDER || 'Jobs-Alerts-Processed' }}
        run: npx tsx scripts/cleanup_gmail.ts

      - name: Report source and pipeline stage status
        if: ${{ always() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PIPELINE_WORKFLOW_NAME: Process Discovery Backlog
          PIPELINE_DEAD_LETTERED_THIS_RUN: ${{ steps.process_pipeline_worker.outputs.dead_lettered_this_run }}
          PIPELINE_TASK_WORKER_MAX_PENDING_AGE_SECONDS: ${{ vars.PIPELINE_TASK_WORKER_MAX_PENDING_AGE_SECONDS || '7200' }}
          PIPELINE_STATUS_REPORT_FILE: pipeline-status-backlog.json
        run: npx tsx scripts/report_pipeline_status.ts

      - name: Upload pipeline status report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-status-backlog-${{ github.run_id }}
          path: pipeline-status-backlog.json
          if-no-files-found: error

      - name: Upload pipeline task dead-letter health
        if: ${{ always() && steps.process_pipeline_worker.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-dead-letter-health-${{ github.run_id }}
          path: pipeline-dead-letter-health.json
          if-no-files-found: warn

      - name: Upload pipeline task reconciliation report
        if: ${{ always() && steps.process_pipeline_worker.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-task-reconciliation-${{ github.run_id }}
          path: pipeline-task-reconciliation.json
          if-no-files-found: warn

      - name: Upload pipeline reconciliation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-reconciliation-${{ github.run_id }}
          path: pipeline-reconciliation-*.json
          if-no-files-found: error

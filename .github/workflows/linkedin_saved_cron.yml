name: Weekly LinkedIn Saved Jobs Sync & Unsave

on:
  schedule:
    # Runs weekly on Sundays at 02:00 UTC (which is 10:00 AM Singapore Time)
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  sync-linkedin-saved:
    name: Sync LinkedIn Saved Jobs & Unsave
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer browsers (Chrome)
        run: npx puppeteer browsers install chrome

      - name: Run LinkedIn Saved Jobs Sync Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}
        run: npx tsx scripts/sync_linkedin_saved.ts

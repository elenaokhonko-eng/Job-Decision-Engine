name: 2. AI Job Evaluation Only

on:
  workflow_dispatch:

jobs:
  evaluate-jobs:
    name: Evaluate Staged Jobs via AI Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Puppeteer OS Dependencies
        run: sudo apt-get update && sudo apt-get install -y libnss3 libnspr4 libgbm1 libasound2 libatk-bridge2.0-0 libatk1.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2

      - name: Run AI Evaluation Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          EVAL_SLEEP_MS: 3000
        run: npx tsx scripts/evaluate_jobs.ts

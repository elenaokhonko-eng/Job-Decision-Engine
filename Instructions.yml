project: Job Decision Engine
status: active_refactor
authoritative_agent_instructions: AGENTS.md
team_registry: .agents/team.yml
backlog: .agents/BACKLOG.md
data_contract: .agents/DATA-FLOW-CONTRACT.md

stack:
  language: TypeScript / Node.js
  database: PostgreSQL / Neon
  testing: Vitest plus PostgreSQL integration and E2E fixtures
  orchestration: GitHub Actions
  consumer: Python Streamlit

mission: >-
  Discover jobs broadly across four career lanes, apply deterministic and
  evidence-based workability gates before generative AI, evaluate only a
  bounded shortlist, preserve every state transition, and generate grounded
  application documents from verified profile evidence.

start_here: |
  Read AGENTS.md, .agents/team.yml, .agents/DATA-FLOW-CONTRACT.md and
  .agents/BACKLOG.md. Act as delivery-orchestrator unless the user explicitly
  selects a specialist. Dispatch only READY work whose dependencies are DONE.
  Do not claim production readiness until the independent release reviewer signs off.

first_execution_wave:
  - work_package: P0-01
    agent: data-contract-checker
    objective: Freeze versioned boundary contracts and expose current drift.
  - work_package: P0-02
    agent: test-evals-specialist
    objective: Add real PostgreSQL CI and reproducible nine-email E2E fixture.

hard_rules:
  - Operational failures never become career rejections.
  - Jobs outside the AI budget are deferred, not rejected.
  - Invalid or mismatched AI output is a provider failure, not success.
  - No source record may silently disappear.
  - No Gmail deletion before durable downstream staging.
  - No random or zero-vector embedding fallback.
  - No required command may hide failure with `|| true` or unconditional exit zero.
  - No agent may approve its own production-readiness sign-off.
